user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    upstream gateway_backend {
        server gateway:8000;
        keepalive 32;
    }

    upstream control_api_backend {
        server control_api:8080;
        keepalive 32;
    }

    # ── 1. HTTP Server (Port 80): Plaintext & Health Check Redirection ──────────
    server {
        listen 80;
        server_name localhost 127.0.0.1 mcp-smartcache.example.com api.example.com;

        # Allow plaintext health checks for edge load balancers
        location = /health {
            proxy_pass http://gateway_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Enforce TLS 1.3 / 1.2 redirection for all operational traffic
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 2. Default Server Block (Drop Untrusted / Unknown Host Headers) ─────────
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            default_type application/json;
            return 400 '{"detail": "Untrusted or invalid Host header."}';
        }
    }

    # ── 3. Production HTTPS Edge Proxy (Port 443 with TLS Termination) ──────────
    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1 mcp-smartcache.example.com api.example.com;

        # TLS Configuration
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy Header Hygiene: Strip untrusted client X-Forwarded headers and reset to verified edge peer
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Direct access to internal runtime engine is strictly blocked
        location /runtime/ {
            default_type application/json;
            return 403 '{"detail": "Direct external access to internal runtime engine is forbidden."}';
        }

        # Health endpoint
        location = /health {
            proxy_pass http://gateway_backend/health;
        }

        # Control Plane API routes
        location /api/ {
            proxy_pass http://control_api_backend/;
        }

        # Gateway Tool Invocations
        location /call {
            proxy_pass http://gateway_backend/call;
        }
        location /tools/ {
            proxy_pass http://gateway_backend/tools/;
        }

        # Gateway MCP Endpoint
        location /mcp/ {
            proxy_pass http://gateway_backend/mcp/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Gateway Root & Fallback
        location / {
            proxy_pass http://gateway_backend/;
        }
    }
}
