# Production Hardened Docker Compose Stack
# MCP SmartCache Gateway, Control API, Runtime, Ingress (TLS Reverse Proxy), Postgres, and Redis

services:
  redis:
    image: redis:7-alpine
    container_name: mcp-smartcache-redis-prod
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    # Strict internal isolation: NOT exposed to host network
    networks:
      - internal-tier
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: mcp-smartcache-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_smartcache}
    # Strict internal isolation: NOT exposed to host network
    networks:
      - internal-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_user} -d ${POSTGRES_DB:-mcp_smartcache}"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: mcp-smartcache-gateway-prod
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mcp_smartcache}
      PYTHONPATH: /app
      ENVIRONMENT: production
      ENABLE_DEV_MOCKS: "false"
      AUTH_ENABLED: "true"
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY}
      GATEWAY_CLIENT_API_KEY: ${GATEWAY_CLIENT_API_KEY}
      CLIENT_TENANT_KEYS: ${CLIENT_TENANT_KEYS}
      QUOTA_REDIS_FAILURE_POLICY: ${QUOTA_REDIS_FAILURE_POLICY:-fail_closed}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_SIGNING_KEY: ${OIDC_SIGNING_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,mcp-smartcache.example.com,api.example.com}
    networks:
      - internal-tier
      - ingress-tier
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  control_api:
    build:
      context: .
      dockerfile: control_api/Dockerfile
    container_name: mcp-smartcache-control-api-prod
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mcp_smartcache}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GATEWAY_MCP_URL: http://gateway:8000
      PYTHONPATH: /app
      ENVIRONMENT: production
      AUTH_ENABLED: "true"
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY}
      GATEWAY_CLIENT_API_KEY: ${GATEWAY_CLIENT_API_KEY}
      CLIENT_TENANT_KEYS: ${CLIENT_TENANT_KEYS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dashboard.example.com}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_SIGNING_KEY: ${OIDC_SIGNING_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,mcp-smartcache.example.com,api.example.com}
    networks:
      - internal-tier
      - ingress-tier
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  runtime:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    container_name: mcp-smartcache-runtime-prod
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mcp_smartcache}
      GATEWAY_MCP_URL: http://gateway:8000
      PYTHONPATH: /app
      ENVIRONMENT: production
      GATEWAY_API_KEY: ${GATEWAY_CLIENT_API_KEY}
    networks:
      - internal-tier
    # Strict internal isolation: NOT exposed to host network
    depends_on:
      gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  ingress:
    image: nginx:1.27-alpine
    container_name: mcp-smartcache-ingress-prod
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - ingress-tier
    depends_on:
      gateway:
        condition: service_healthy
      control_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  internal-tier:
    internal: true
  ingress-tier:
    internal: false

volumes:
  postgres-prod-data:
